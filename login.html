<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Facilitator Login | Management System</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <meta name="theme-color" content="#3b82f6">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <script src="offlineSyncUtility.js" defer></script>
    <script src="mjr-offline.js" defer></script>
    <script>
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
        document.addEventListener("gesturechange", function (e) { e.preventDefault(); });
        document.addEventListener("touchmove", function (e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
    
    <style>
        :root {
            /* MATCHING THE IMAGE DESIGN VARIABLES */
            --main-bg: #e8f0fe;       /* Soft light blue background */
            --card-bg: #ffffff;       /* Pure white card */
            --text-main: #111827;     /* Dark text */
            --text-muted: #6b7280;    /* Muted text for subtitle */
            --label-color: #1d4ed8;   /* Blueish label color like in the image */
            --border-color: #e5e7eb;  /* Light gray border */
            --input-bg: #ffffff;      
            --input-bg-focus: #f8fafc;
            
            --accent-blue: #2563eb;   /* Main button blue */
            --accent-hover: #2563eb;  
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e4effe 0%, #f0f5ff 100%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            overflow: hidden; /* Prevent scrollbar during splash */
        }

        /* ── PROFESSIONAL SPLASH ── */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0b1220 0%, #16255c 55%, #1e3a8a 100%);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.9s ease-in-out;
            overflow: hidden;
        }

        .splash-content {
            text-align: center;
            color: white;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: contentIn 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            will-change: opacity, transform;
        }
        @keyframes contentIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes ringIn {
            0% { opacity: 0; transform: scale(0.88); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* AcadTrack - smooth letter entrance */
        .splash-title {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 3px;
            display: flex;
            justify-content: center;
        }
        .splash-letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(22px);
            animation: letterIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background: linear-gradient(180deg, #fde68a 0%, #f59e0b 55%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: none;
            will-change: opacity, transform;
        }
        @keyframes letterIn {
            0% { opacity: 0; transform: translateY(22px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Slim progress bar */
        .splash-loader {
            width: 210px;
            height: 3px;
            margin: 26px auto 0;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            overflow: hidden;
        }
        .splash-loader-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #f59e0b, #fbbf24, #60a5fa, #93c5fd);
            border-radius: 999px;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
        }

        /* Clean White Card */
        .login-container {
            background: var(--card-bg);
            padding: 45px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-header h2 {
            font-size: 1.6rem;
            margin-bottom: 6px;
            font-weight: 700;
            color: var(--text-main);
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            color: var(--label-color);
            font-weight: 600;
        }

        /* Wrapper for the password eye icon */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        /* HIDE DEFAULT BROWSER EYE ICON (Edge/IE) */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
            background: var(--input-bg-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); 
        }

        /* Eye Icon Styling */
        .toggle-password {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--accent-blue);
        }

        /* Remember me & Forgot Password Row */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.8rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
            font-weight: 500;
            cursor: pointer;
        }

        .remember-me input {
            cursor: pointer;
            width: 14px;
            height: 14px;
            accent-color: var(--accent-blue);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out, transform 0.1s;
        }

        .login-btn:hover {
            background-color: var(--accent-hover);
        }
        
        .login-btn:active {
            transform: scale(0.98);
        }

        /* â”€â”€ Professional Alert Modal â”€â”€ */
        .custom-alert-overlay {
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 200000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }
        .custom-alert-overlay.show { opacity: 1; pointer-events: auto; }
        .custom-alert-box {
            background: #fff; padding: 0; border-radius: 14px;
            box-shadow: 0 25px 60px -12px rgba(0,0,0,0.3);
            width: 88%; max-width: 360px; text-align: center;
            transform: translateY(-12px) scale(0.97);
            transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
            overflow: hidden;
        }
        .custom-alert-overlay.show .custom-alert-box { transform: translateY(0) scale(1); }
        .custom-alert-topbar {
            height: 4px; width: 100%;
            background: var(--accent-blue);
        }
        .custom-alert-body {
            padding: 28px 24px 20px;
        }
        .custom-alert-icon {
            width: 48px; height: 48px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.3rem; margin-bottom: 16px;
            background: rgba(59,130,246,0.1);
        }
        .custom-alert-title {
            font-size: 1.1rem; font-weight: 700;
            color: #111827; margin-bottom: 8px;
        }
        .custom-alert-msg {
            font-size: 0.85rem; color: #6b7280;
            margin-bottom: 24px; line-height: 1.6;
            white-space: pre-line; word-break: break-word;
        }
        .custom-alert-btn {
            background: #111827; color: #fff; border: none;
            padding: 11px 20px; border-radius: 10px;
            font-weight: 600; width: 100%; cursor: pointer;
            transition: background 0.2s; font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
        }
        .custom-alert-btn:hover { background: #1e293b; }
    </style>
</head>
<body>

    <div id="offlineStatusBar" style="display:none;position:fixed;top:0;left:0;right:0;background:#f59e0b;color:#fff;text-align:center;padding:8px 12px;font-size:13px;z-index:100000;font-family:'Inter',sans-serif;">
        <i class="fa-solid fa-wifi-slash"></i> You are offline â€” <span id="offlineQueueCount">0</span> pending submission(s)
    </div>

    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <h1 class="splash-title" id="splashTitle">AcadTrack</h1>
            <div class="splash-loader"><div class="splash-loader-fill" id="splashProgressFill"></div></div>
        </div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Facilitator</h2>
            <p>Login to your account</p>
        </div>

        <form id="faciLoginForm">
            <div class="input-group">
                <label for="accountId">Facilitator ID</label>
                <input type="text" id="accountId" placeholder="e.g. FACI-1234" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword" title="Show/Hide Password"></i>
                </div>
            </div>

            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Login</button>
        </form>
    </div>

    <div id="customAlertOverlay" class="custom-alert-overlay">
        <div class="custom-alert-box">
            <div class="custom-alert-topbar" id="alertTopbar"></div>
            <div class="custom-alert-body">
                <div class="custom-alert-icon" id="alertIconWrap"><i class="fa-solid fa-circle-xmark" id="alertIcon" style="color: #ef4444;"></i></div>
                <h3 class="custom-alert-title" id="customAlertTitle">Notice</h3>
                <p id="customAlertMessage" class="custom-alert-msg"></p>
                <button onclick="closeAlert()" class="custom-alert-btn">Okay</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase Setup
        const SUPABASE_URL ='https://njzvuwkepaasnsvuujgx.supabase.co'; 
        const SUPABASE_ANON_KEY ='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qenZ1d2tlcGFhc25zdnV1amd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1OTk5MTgsImV4cCI6MjA5MzE3NTkxOH0.tFh2d3ZIZYMWk-7HHckCbkwbTJ7uQ9onGeTaaUlkeH0'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const API_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://127.0.0.1:5000'
            : 'https://teacher-panel-d1kw.onrender.com';

        // ðŸŒŸ CUSTOM ALERT FUNCTIONS ðŸŒŸ
        function showAlert(title, message, iconClass = 'fa-circle-xmark', iconColor = '#ef4444') {
            document.getElementById('customAlertTitle').textContent = title;
            document.getElementById('customAlertMessage').textContent = message;
            
            const iconEl = document.getElementById('alertIcon');
            iconEl.className = `fa-solid ${iconClass}`;
            iconEl.style.color = iconColor;
            const wrap = document.getElementById('alertIconWrap');
            wrap.style.color = iconColor;
            wrap.style.background = 'color-mix(in srgb, ' + iconColor + ', transparent 85%)';
            const tb = document.getElementById('alertTopbar');
            if (tb) tb.style.background = iconColor;
            
            document.getElementById('customAlertOverlay').classList.add('show');
        }

        function closeAlert() {
            document.getElementById('customAlertOverlay').classList.remove('show');
        }

        // ðŸŒŸ INSTANT AUTO-LOGIN CHECK ðŸŒŸ
        window.addEventListener('DOMContentLoaded', () => {
            const fill = document.getElementById('splashProgressFill');
            // Animate the progress bar to full over `ms`, then the splash
            // redirects / hides. Slight delay lets the 0% width paint first.
            const startFill = (ms) => {
                if (!fill) return;
                fill.style.transition = 'width ' + ms + 'ms cubic-bezier(0.4, 0, 0.2, 1)';
                setTimeout(() => { fill.style.width = '100%'; }, 50);
            };
            const activeFaciId = localStorage.getItem('faci_id');
            if (activeFaciId) {
                startFill(1600); // reaches full just before the 1750ms redirect

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1750);
                return;
            }

            // Not logged in: fill over the splash's ~2s, then it fades to the form.
            startFill(1900);

            // Check if Faci ID was remembered
            const rememberedId = localStorage.getItem('remembered_faci_id');
            if (rememberedId) {
                document.getElementById('accountId').value = rememberedId;
                document.getElementById('rememberMe').checked = true;
            }
        });

        // ðŸŒŸ SPLASH SCREEN LOGIC ðŸŒŸ
        // Split "AcadTrack" into letter spans for the staggered entrance.
        (function () {
            var titleEl = document.getElementById('splashTitle');
            if (titleEl) {
                var text = titleEl.textContent;
                titleEl.innerHTML = '';
                for (var i = 0; i < text.length; i++) {
                    var s = document.createElement('span');
                    s.className = 'splash-letter';
                    s.textContent = text[i] === ' ' ? '\u00A0' : text[i];
                    s.style.animationDelay = (0.25 + i * 0.055) + 's';
                    titleEl.appendChild(s);
                }
            }
        })();

        window.addEventListener('load', function() {
            if (!localStorage.getItem('faci_id')) {
                const splashScreen = document.getElementById('splashScreen');
                setTimeout(() => {
                    splashScreen.style.opacity = '0';
                    splashScreen.style.visibility = 'hidden';
                    document.body.style.overflow = 'auto';
                }, 2000); /* full animation ~1.75s + fade, so letters + subtitle complete before hiding */
            }
        });

        // Offline Status Bar
        window.addEventListener('load', function () {
            if (window.__offlineSync) {
                window.__offlineSync.onchange = function (items) {
                    var bar = document.getElementById('offlineStatusBar');
                    var count = document.getElementById('offlineQueueCount');
                    if (bar && count) {
                        if (!window.__offlineSync.isOnline || items.length > 0) {
                            bar.style.display = 'block';
                            count.textContent = items.length;
                        } else {
                            bar.style.display = 'none';
                        }
                    }
                };
                window.__offlineSync.pendingCount().then(function (count) {
                    var bar = document.getElementById('offlineStatusBar');
                    var countEl = document.getElementById('offlineQueueCount');
                    if (bar && countEl) {
                        if (!navigator.onLine || count > 0) {
                            bar.style.display = 'block';
                            countEl.textContent = count;
                        }
                    }
                });
            }
        });

        // Password Visibility Toggle Logic
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // ðŸ”¥ DIRECT SUPABASE LOGIN LOGIC ðŸ”¥
        document.getElementById('faciLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const accountId = document.getElementById('accountId').value.trim();
            const password = passwordInput.value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';
            loginBtn.disabled = true;

            // Offline path: check saved credentials in IndexedDB
            if (!navigator.onLine) {
                var bcryptLib = (window.dcodeIO && window.dcodeIO.bcrypt) || window.bcrypt;
                var creds = null;
                if (bcryptLib && window.__offlineSync) {
                    creds = await window.__offlineSync.getLocalCreds(accountId);
                }
                if (creds && bcryptLib.compareSync(password, creds.passwordHash)) {
                    var faciData = creds.faciData;
                    if (rememberMe) { localStorage.setItem('remembered_faci_id', accountId); } else { localStorage.removeItem('remembered_faci_id'); }
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('user_id');
                    localStorage.removeItem('cached_user_name');
                    localStorage.removeItem('cached_user_avatar');
                    localStorage.setItem('faci_id', faciData.id);
                    localStorage.setItem('faci_name', faciData.full_name);
                    localStorage.setItem('faci_section', faciData.section);
                    localStorage.setItem('faci_subject', faciData.subject);
                    if (faciData.teacher_id) localStorage.setItem('faci_teacher_id', faciData.teacher_id);
                    else localStorage.removeItem('faci_teacher_id');
                    loginBtn.style.backgroundColor = '#10b981';
                    loginBtn.innerHTML = '<i class="fa-solid fa-check"></i> Login successful';
                    setTimeout(function () { window.location.href = 'index.html'; }, 800);
                    return;
                }
                showAlert("Offline", "Not connected to the internet and no saved credentials found. Please connect and try again.", "fa-wifi-slash", "#f59e0b");
                loginBtn.innerHTML = 'Login';
                loginBtn.disabled = false;
                return;
            }

            try {
                // Fast path: verify the login in the browser with bcrypt.js, so we
                // don't wait on the (sleepy free-tier) backend to wake up. Only the
                // one matching account's row is read. Falls back to the server
                // endpoint if the crypto library didn't load.
                const bcryptLib = (window.dcodeIO && window.dcodeIO.bcrypt) || window.bcrypt;
                let faciData = null;

                if (bcryptLib) {
                    const { data: row, error } = await supabaseClient
                        .from('facilitators')
                        .select('id, full_name, section, subject, teacher_id, password')
                        .eq('account_id', accountId)
                        .maybeSingle();
                    if (error) throw error;
                    if (row && row.password && bcryptLib.compareSync(password, row.password)) {
                        faciData = { id: row.id, full_name: row.full_name, section: row.section, subject: row.subject, teacher_id: row.teacher_id };
                        if (window.__offlineSync) {
                            window.__offlineSync.saveLocalCreds(accountId, row.password, faciData);
                        }
                    }
                } else {
                    const res = await fetch(`${API_URL}/api/faci/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ account_id: accountId, password: password })
                    });
                    const result = await res.json().catch(() => ({}));
                    if (res.ok) faciData = result.faci;
                }

                if (!faciData) {
                    // Invalid Credentials
                    showAlert(
                        "Login Failed",
                        "We couldn't find an account with those details. Please check your ID and password.",
                        "fa-circle-xmark",
                        "#ef4444"
                    );
                    loginBtn.innerHTML = 'Login';
                    loginBtn.disabled = false;
                    return;
                }

                // If code reaches here, login is successful!
                
                if (rememberMe) {
                    localStorage.setItem('remembered_faci_id', accountId);
                } else {
                    localStorage.removeItem('remembered_faci_id');
                }

                // Clear any teacher session data to avoid conflicts
                localStorage.removeItem('access_token');
                localStorage.removeItem('user_id');
                localStorage.removeItem('cached_user_name');
                localStorage.removeItem('cached_user_avatar');

                // Save Facilitator data to local storage
                localStorage.setItem('faci_id', faciData.id);
                localStorage.setItem('faci_name', faciData.full_name);
                localStorage.setItem('faci_section', faciData.section);
                localStorage.setItem('faci_subject', faciData.subject);
                if (faciData.teacher_id) localStorage.setItem('faci_teacher_id', faciData.teacher_id);
                else localStorage.removeItem('faci_teacher_id');

                // Update `last_login` and `status` in Supabase
                try {
                    const { error: dbError } = await supabaseClient
                        .from('facilitators')
                        .update({ 
                            last_login: new Date().toISOString(),
                            status: 'Active' 
                        })
                        .eq('id', faciData.id);
                        
                    if (dbError) throw dbError;
                } catch (dbError) {
                    console.error("Failed to update last login in Supabase:", dbError);
                }

                // UI Success state
                loginBtn.style.backgroundColor = '#10b981'; 
                loginBtn.innerHTML = '<i class="fa-solid fa-check"></i> Login successful';
                
                setTimeout(() => {
                    window.location.href = 'index.html'; 
                }, 800);

            } catch (error) {
                console.error('Login request failed:', error);
                showAlert(
                    "Connection Error", 
                    "We're having trouble connecting. Please check your internet connection and try again.", 
                    "fa-wifi", 
                    "#f59e0b"
                );
                loginBtn.innerHTML = 'Login';
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
